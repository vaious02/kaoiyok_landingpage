[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# โดเมนหลักคือแบบไม่มี www ตาม canonical ใน index.html
# ถ้ามีคนเข้าผ่าน www ให้เด้งมาที่โดเมนหลัก จะได้ไม่นับเป็นสองหน้าซ้ำกัน
[[redirects]]
  from = "https://www.kaoiyok-elderlycare.com/*"
  to = "https://kaoiyok-elderlycare.com/:splat"
  status = 301
  force = true
